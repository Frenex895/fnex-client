name: Build FNEX Client
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - run: gradle build
      - run: python3 tools/make_mrpack.py build/libs/fnex-client-1.0.0.jar
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: fnex-client
          path: |
            build/libs/fnex-client-1.0.0.jar
            *.mrpack
